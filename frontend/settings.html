<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ion Sense Settings</title>
  <style>
    :root { color: #edf7ef; background: #050907; font-family: "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px; background: radial-gradient(circle at 50% 0, #102016, #050907 52%); }
    main { width: min(520px, 100%); padding: 30px; border: 1px solid rgba(61,255,107,.35); border-radius: 24px; background: rgba(4,12,8,.94); box-shadow: 0 0 28px rgba(61,255,107,.08); }
    p { color: #94a198; line-height: 1.55; }
    .eyebrow { color: #3dff6b; font: 700 11px/1 ui-monospace, monospace; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: 28px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Ion Sense // Desktop</div>
    <h1>Settings</h1>
    <p>The native settings controls are added in the final wiring pass. This window intentionally starts hidden and is opened from the tray.</p>
  </main>
</body>
</html>
