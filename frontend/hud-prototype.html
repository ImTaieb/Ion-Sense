<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ion Sense — HUD Prototype</title>
  <script>
    if (new URLSearchParams(window.location.search).get("dev") === "1") {
      document.documentElement.dataset.dev = "1";
    }
  </script>
  <style>
    /* ====================================================================
       Final ION Sense design tokens. This is the LAST design pass for
       this product. Future work consumes these tokens; do not introduce
       new values, weights, radii, easings, or colors without updating
       the system and MASTER.md.

       Type scale: 10 / 11 / 12 / 13 / 15 / 17 / 22 / 28
       Font weight: 400 body, 500 medium, 600 semibold, 700 bold
       Letter spacing: -0.01em display, 0 body, 0.06em label, 0.18em eyebrow
       Spacing: 4 / 8 / 12 / 16 / 20 / 24 / 32 / 40 / 48
       Radius: 6 (small controls) / 10 (inputs/cards) / 16 (panels) / 999 (pills)
       Motion: 140 / 200 / 280 / 360 / 5000 ms, 3 curves (see below)
       ==================================================================== */
    :root {
      /* surfaces */
      --ion-bg:            #030605;
      --ion-surface:       rgba(8, 14, 10, 0.86);
      --ion-surface-raised: rgba(11, 19, 14, 0.92);
      --ion-border:        rgba(207, 244, 216, 0.09);
      --ion-border-active: rgba(69, 238, 134, 0.32);

      /* accent */
      --ion-green:         #45EE86;
      --ion-green-bright:  #65F59B;
      --ion:               var(--ion-green);
      --ion-bright:        var(--ion-green-bright);
      --ion-rgb:           69, 238, 134;

      /* text */
      --ion-text:           #ECF4EE;
      --ion-text-secondary: rgba(220, 232, 224, 0.66);
      --ion-text-tertiary:  rgba(190, 205, 196, 0.42);

      /* radius */
      --ion-radius-sm:  6px;
      --ion-radius-md:  10px;
      --ion-radius-lg:  16px;
      --ion-radius-pill: 999px;

      /* spacing (the 9 values used across both surfaces; never reach for a 13px or 17px) */
      --ion-sp-1: 4px;
      --ion-sp-2: 8px;
      --ion-sp-3: 12px;
      --ion-sp-4: 16px;
      --ion-sp-5: 20px;
      --ion-sp-6: 24px;
      --ion-sp-7: 32px;
      --ion-sp-8: 40px;
      --ion-sp-9: 48px;

      /* motion */
      --ion-motion-micro:  140ms;
      --ion-motion-ctrl:   200ms;
      --ion-motion-panel:  280ms;
      --ion-motion-spatial: 360ms;
      --ion-motion-dwell:  5000ms;
      --ion-spring:        cubic-bezier(.2, .7, .2, 1);
      --ion-spatial:       cubic-bezier(.25, .8, .25, 1);

      /* HUD layout */
      --panel:        var(--ion-surface);
      --toast-width:  min(1180px, calc(100vw - 96px));
      --badge-size:   220px;
      --enter-ms:     var(--ion-motion-spatial);
      --exit-ms:      var(--ion-motion-ctrl);

      /* legacy aliases retained for older rules that still reference them */
      --text:    var(--ion-text);
      --muted:   var(--ion-text-secondary);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background-color: rgba(0, 0, 0, 0);
    }

    body {
      overflow: hidden;
      color: var(--ion-text);
      background: transparent;
      font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      letter-spacing: -0.005em;
    }

    html[data-dev="1"] body {
      background:
        radial-gradient(circle at 78% 18%, rgba(var(--ion-rgb), 0.065), transparent 31%),
        radial-gradient(circle at 15% 84%, rgba(36, 92, 55, 0.14), transparent 32%),
        linear-gradient(142deg, #010302 0%, #07100b 47%, #020604 100%);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] {
      display: none !important;
    }

    /* Ambient desktop-like backdrop: enough contrast to judge the glass without
       becoming part of the notification itself. */
    .demo-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      isolation: isolate;
      overflow: hidden;
      pointer-events: none;
    }

    html[data-dev="1"] .demo-backdrop {
      display: block;
    }

    .demo-backdrop::before {
      content: "";
      position: absolute;
      inset: -22%;
      z-index: -2;
      opacity: 0.42;
      background-image:
        linear-gradient(rgba(var(--ion-rgb), 0.027) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--ion-rgb), 0.027) 1px, transparent 1px);
      background-size: 58px 58px;
      transform: perspective(700px) rotateX(64deg) translateY(28%);
      transform-origin: center bottom;
      mask-image: linear-gradient(to bottom, transparent 0%, #000 42%, #000 100%);
    }

    .demo-backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      opacity: 0.11;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(255, 255, 255, 0.075) 4px
      );
      mix-blend-mode: soft-light;
    }

    .ambient-orbit {
      position: absolute;
      width: min(66vw, 980px);
      aspect-ratio: 1;
      right: -20vw;
      top: -35vw;
      border: 1px solid rgba(var(--ion-rgb), 0.065);
      border-radius: 50%;
      box-shadow:
        0 0 0 82px rgba(var(--ion-rgb), 0.015),
        0 0 0 190px rgba(var(--ion-rgb), 0.012);
    }

    .ambient-copy {
      position: absolute;
      left: clamp(22px, 4vw, 64px);
      top: clamp(24px, 7vh, 72px);
      color: rgba(179, 202, 187, 0.27);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font: 600 10px/1.65 ui-monospace, "SFMono-Regular", Consolas, monospace;
    }

    .ambient-copy strong {
      display: block;
      margin-bottom: 5px;
      color: rgba(var(--ion-rgb), 0.34);
      font-size: 11px;
      font-weight: 600;
    }

    .ambient-index {
      position: absolute;
      right: clamp(20px, 3.2vw, 52px);
      bottom: clamp(86px, 12vh, 132px);
      display: grid;
      grid-template-columns: auto auto;
      gap: 6px 18px;
      color: rgba(166, 185, 173, 0.19);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font: 600 9px/1.3 ui-monospace, "SFMono-Regular", Consolas, monospace;
    }

    .ambient-index span:nth-child(even) {
      color: rgba(var(--ion-rgb), 0.2);
      text-align: right;
    }

    .hud-layer {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background-color: rgba(0, 0, 0, 0);
    }

    .hud-toast {
      position: absolute;
      top: clamp(24px, 7vh, 74px);
      right: clamp(18px, 4vw, 64px);
      width: var(--toast-width);
      min-height: 224px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform-origin: 100% 0;
      will-change: transform, opacity, clip-path;
    }

    .hud-toast.is-entering,
    .hud-toast.is-visible,
    .hud-toast.is-exiting,
    .hud-toast.is-preparing {
      visibility: visible;
    }

    .hud-toast.is-entering {
      pointer-events: auto;
      animation: hud-in var(--enter-ms) var(--ion-spring) both;
    }

    .hud-toast.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate3d(0, 0, 0);
    }

    .hud-toast.is-exiting {
      pointer-events: none;
      animation: hud-out var(--exit-ms) var(--ion-spring) both;
    }

    @keyframes hud-in {
      from { opacity: 0; transform: translateY(5px) scale(0.985); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    @keyframes hud-out {
      from { opacity: 1; transform: translateY(0)    scale(1); }
      to   { opacity: 0; transform: translateY(-3px) scale(0.992); }
    }

    .panel-shell {
      position: relative;
      min-height: 224px;
      overflow: hidden;
      border: 1px solid var(--ion-border-active);
      border-radius: 138px 62px 62px 138px;
      background: var(--ion-surface);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 18px 36px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(14px) saturate(112%);
    }

    .panel-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 91% 18%, rgba(var(--ion-rgb), 0.115), transparent 28%),
        linear-gradient(90deg, transparent 12%, rgba(255, 255, 255, 0.017) 49%, transparent 77%);
    }

    .panel-shell::after {
      content: "";
      position: absolute;
      top: 24px;
      right: 32px;
      width: 80px;
      height: 40px;
      opacity: 0.12;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(var(--ion-rgb), 0.62) 0 1px, transparent 1.3px);
      background-size: 8px 8px;
    }

    .panel-content {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-rows: 64px 1fr 80px;
      min-height: calc(var(--badge-size) + 16px);
      padding-left: 0;
    }

    .hud-header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 6px 16px 0 18px;
    }

    .brand-name {
      flex: 0 0 auto;
      color: var(--ion-green-bright);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: none;
      font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", sans-serif;
      font-size: 11px;
      font-weight: 500;
    }

    .header-rule {
      height: 1px;
      min-width: 24px;
      margin: 0 12px;
      flex: 1;
      background: linear-gradient(90deg, var(--ion-border-active), transparent);
      box-shadow: none;
    }

    .close-button {
      position: relative;
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      border: 0;
      border-radius: 50%;
      color: var(--ion-text-secondary);
      background: transparent;
      cursor: pointer;
      transition: color var(--ion-motion-ctrl) var(--ion-spring), background var(--ion-motion-ctrl) var(--ion-spring);
    }

    .close-button::before,
    .close-button::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 13px;
      width: 12px;
      height: 1px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: none;
    }

    .close-button::before {
      transform: rotate(45deg);
    }

    .close-button::after {
      transform: rotate(-45deg);
    }

    .close-button:hover {
      background: rgba(var(--ion-rgb), 0.06);
    }

    .close-button:active {
      transform: none;
    }

    .close-button:focus-visible {
      outline: 1px solid var(--ion-border-active);
      outline-offset: 3px;
      background: rgba(var(--ion-rgb), 0.06);
    }

    .hud-body {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      align-items: center;
      gap: var(--ion-sp-5);
      min-width: 0;
      padding: 4px var(--ion-sp-7) 12px 22px;
    }

    .event-icon-shell {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 1px solid var(--ion-border-active);
      border-radius: 50%;
      color: var(--ion-green);
      background: rgba(0, 0, 0, 0.18);
      box-shadow: none;
    }

    .event-icon-shell svg {
      width: 24px;
      height: 24px;
      overflow: visible;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: none;
    }

    .event-copy {
      min-width: 0;
    }

    .event-title {
      overflow: hidden;
      margin: 0 0 8px 0;
      color: var(--ion-text);
      letter-spacing: -0.01em;
      text-overflow: ellipsis;
      text-transform: none;
      white-space: nowrap;
      text-shadow: none;
      font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", sans-serif;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.05;
    }

    .event-message {
      display: -webkit-box;
      overflow: hidden;
      margin: 0;
      color: var(--ion-text-secondary);
      letter-spacing: 0;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.5;
    }

    .hud-footer {
      display: grid;
      grid-template-columns: 28px minmax(90px, 1fr) auto;
      align-items: center;
      gap: var(--ion-sp-4);
      min-width: 0;
      padding: 0 var(--ion-sp-7) 0 22px;
      border-top: 1px solid var(--ion-border);
      background: transparent;
    }

    .speaker-icon {
      width: 18px;
      height: 18px;
      color: var(--ion-text-secondary);
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: none;
    }

    .waveform {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5px;
      height: 28px;
      min-width: 0;
      overflow: hidden;
      color: var(--ion-green);
      filter: none;
    }

    .waveform::after {
      content: none;
    }

    .wave-bar {
      width: 1.5px;
      height: var(--bar-height);
      min-height: 2px;
      flex: 0 0 1.5px;
      border-radius: 999px;
      opacity: 0.18;
      transform: scaleY(0.24);
      transform-origin: center;
      background: currentColor;
      filter: none;
    }

    .wave-bar.is-dot {
      width: 2px;
      height: 2px;
      min-height: 2px;
      flex-basis: 2px;
      border-radius: 50%;
      transform: scale(1);
    }

    .wave-bar.is-dotted {
      width: 2px;
      background: repeating-linear-gradient(
        to bottom,
        currentColor 0 2px,
        transparent 2px 4px
      );
    }

    .spoken-line {
      margin: 0;
      color: var(--ion-text);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: none;
      font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", sans-serif;
      font-size: 12px;
      font-weight: 600;
    }

    .brand-badge {
      position: absolute;
      top: 50%;
      left: calc(var(--badge-size) * -0.48);
      z-index: 8;
      width: var(--badge-size);
      height: var(--badge-size);
      border-radius: 50%;
      transform: translateY(-50%);
      background:
        radial-gradient(circle at 45% 40%, rgba(var(--ion-rgb), 0.09), transparent 45%),
        radial-gradient(circle, #07100a 0%, #020503 70%, #000 100%);
      box-shadow: 12px 0 28px rgba(0, 0, 0, 0.54);
      filter: none;
      pointer-events: none;
    }

    .brand-badge::after {
      content: "";
      position: absolute;
      inset: 16%;
      border-radius: 50%;
      opacity: 0.5;
      background: radial-gradient(circle, transparent 64%, rgba(var(--ion-rgb), 0.04) 65%, transparent 70%);
    }

    .badge-svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .badge-outer,
    .badge-arc,
    .badge-mark,
    .badge-dot-bright {
      stroke: var(--ion-green-bright);
      filter: none;
    }

    .badge-arc {
      transform-box: fill-box;
      transform-origin: center;
      animation: badge-arc-rotate 5s var(--ion-spatial) infinite;
    }

    .is-entering .badge-arc,
    .is-visible .badge-arc {
      animation: badge-arc-rotate 5s var(--ion-spatial) infinite;
    }

    .dev-harness {
      position: fixed;
      left: 50%;
      bottom: 20px;
      z-index: 100;
      width: min(1020px, calc(100vw - 28px));
      transform: translateX(-50%);
      color: #c7d2cb;
      border: 1px solid var(--ion-border);
      border-radius: var(--ion-radius-md);
      background: rgba(2, 7, 4, 0.86);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(14px);
    }

    .dev-harness-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
    }

    .dev-label {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 6px 0 2px;
      color: var(--ion-text-tertiary);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", sans-serif;
    }

    .dev-live-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--ion-green);
    }

    .dev-buttons {
      display: flex;
      flex: 1;
      gap: var(--ion-sp-2);
      min-width: 0;
    }

    .dev-button {
      min-width: 0;
      flex: 1 1 auto;
      padding: 8px var(--ion-sp-3);
      overflow: hidden;
      color: var(--ion-text-secondary);
      border: 1px solid var(--ion-border);
      border-radius: var(--ion-radius-sm);
      background: rgba(255, 255, 255, 0.025);
      cursor: pointer;
      letter-spacing: 0.06em;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10px;
      font-weight: 500;
      transition: color var(--ion-motion-micro) var(--ion-spring), border-color var(--ion-motion-micro) var(--ion-spring), background var(--ion-motion-micro) var(--ion-spring);
    }

    .dev-button:hover {
      color: var(--ion-green);
      border-color: var(--ion-border-active);
      background: rgba(var(--ion-rgb), 0.075);
    }

    .dev-button:active {
      transform: none;
    }

    .dev-button:focus-visible {
      outline: 1px solid var(--ion-border-active);
      outline-offset: 2px;
    }

    .dev-status {
      min-width: 68px;
      padding-left: var(--ion-sp-3);
      color: var(--ion-text-tertiary);
      border-left: 1px solid var(--ion-border);
      letter-spacing: 0.18em;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      font-size: 10px;
      font-weight: 500;
      line-height: 1.2;
      font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", sans-serif;
    }

    @media (max-width: 920px) {
      :root {
        --badge-size: 178px;
      }

      .hud-toast {
        right: 18px;
        min-height: 216px;
      }

      .panel-shell {
        min-height: 216px;
        border-radius: var(--ion-radius-lg);
      }

      .panel-content {
        min-height: 214px;
        padding-left: 117px;
      }

      .hud-body {
        grid-template-columns: 55px minmax(0, 1fr);
        gap: 14px;
        padding-right: 20px;
      }

      .event-icon-shell {
        width: 55px;
        height: 55px;
      }

      .hud-footer {
        gap: 11px;
        padding-right: 18px;
      }

      .dev-harness-inner {
        align-items: stretch;
      }

      .dev-label,
      .dev-status {
        align-self: center;
      }

      .dev-buttons {
        flex-wrap: wrap;
      }

      .dev-button {
        flex-basis: calc(33.333% - 5px);
      }
    }

    @media (max-width: 560px) {
      :root {
        --toast-width: calc(100vw - 28px);
        --badge-size: 128px;
      }

      .hud-toast {
        top: 14px;
        right: 14px;
        min-height: 236px;
      }

      .panel-shell {
        min-height: 236px;
        border-radius: var(--ion-radius-lg);
      }

      .panel-content {
        grid-template-rows: 45px 1fr 58px;
        min-height: 234px;
        padding-left: 0;
      }

      .brand-badge {
        top: 50%;
        left: -6px;
      }

      .hud-header {
        padding-left: 132px;
      }

      .brand-name {
        font-size: 10px;
      }

      .header-rule {
        margin-left: 10px;
        margin-right: 6px;
      }

      .hud-body {
        grid-template-columns: 48px minmax(0, 1fr);
        gap: 11px;
        padding: 14px 16px 14px 132px;
      }

      .event-icon-shell {
        width: 48px;
        height: 48px;
      }

      .event-icon-shell svg {
        width: 27px;
        height: 27px;
      }

      .event-title {
        margin-bottom: 5px;
        display: -webkit-box;
        white-space: normal;
        text-overflow: clip;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        font-size: clamp(15px, 4.4vw, 17px);
      }

      .event-message {
        font-size: 12px;
      }

      .hud-footer {
        grid-template-columns: 23px minmax(52px, 1fr) auto;
        gap: 8px;
        padding: 0 14px;
      }

      .spoken-line {
        font-size: 10px;
      }

      .wave-bar:nth-child(3n) {
        display: none;
      }

      .dev-harness {
        bottom: 10px;
      }

      .dev-harness-inner {
        display: grid;
        grid-template-columns: 1fr auto;
      }

      .dev-buttons {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-row: 2;
      }

      .dev-button {
        padding: 7px 5px;
        font-size: 10px;
      }

      .dev-status {
        border-left: 0;
      }
    }

    @media (max-width: 410px) {
      :root {
        --badge-size: 98px;
      }

      .hud-header,
      .hud-body {
        padding-left: 104px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-delay: 0ms !important;
        transition-duration: 140ms !important;
      }

      .hud-toast.is-entering {

    }
    @keyframes visualizer-baseline-in {
      from { opacity: 0; transform: translate3d(-50%, -50%, 0) scaleX(0); }
      to { opacity: .24; transform: translate3d(-50%, -50%, 0) scaleX(1); }
    }
    @keyframes visualizer-bar-in {
      0% { opacity: 0; transform: scaleY(.04); }
      68% { opacity: .92; transform: scaleY(1.08); }
      100% { opacity: .68; transform: scaleY(.78); }
    }
    @keyframes visualizer-dot-in {
      0% { opacity: 0; transform: scale(0); }
      68% { opacity: .88; transform: scale(1.06); }
      100% { opacity: .66; transform: scale(.84); }
    }
    @keyframes visualizer-energy-pass {
      0% { opacity: 0; transform: translate3d(-130%, 0, 0); }
      36% { opacity: .7; }
      100% { opacity: 0; transform: translate3d(655%, 0, 0); }
    }
    @keyframes visualizer-container-out {
      0% { opacity: var(--wave-exit-opacity, 1); transform: var(--wave-exit-transform, none); }
      58% { opacity: var(--wave-exit-opacity, 1); transform: none; }
      100% { opacity: 0; transform: scaleX(.92); }
    }
    @keyframes visualizer-baseline-out {
      from { opacity: var(--wave-baseline-exit-opacity, .18); transform: var(--wave-baseline-exit-transform, translate3d(-50%, -50%, 0) scaleX(1)); }
      to { opacity: 0; transform: translate3d(-50%, -50%, 0) scaleX(0); }
    }
    @keyframes visualizer-bar-out {
      from { opacity: var(--wave-exit-opacity, var(--wave-opacity, .68)); transform: var(--wave-exit-transform, scaleY(var(--wave-level, .78))); }
      to { opacity: 0; transform: scaleY(.04); }
    }
    @keyframes visualizer-dot-out {
      from { opacity: var(--wave-exit-opacity, var(--wave-opacity, .66)); transform: var(--wave-exit-transform, scale(var(--wave-level, .84))); }
      to { opacity: 0; transform: scale(0); }
    }

    /* Severity-aware signal layer. The palette stays Ion green; only the border
       opacity flickers with the event contract. */
    .hud-toast {
      --severity-border: 0.32;
      --progress-opacity: 0.45;
    }
    .hud-toast[data-severity="info"] { --severity-border: 0.18; }
    .hud-toast[data-severity="warning"] { --severity-border: 0.32; }
    .hud-toast[data-severity="critical"] { --severity-border: 0.55; }
    .hud-toast[data-severity] .panel-shell {
      border-color: rgba(var(--ion-rgb), var(--severity-border));
    }
    .hud-layer[data-severity="info"] .screen-overlay::before { opacity: 0.5; }
    .hud-layer[data-severity="warning"] .screen-overlay::before { opacity: 0.7; }
    .hud-layer[data-severity="critical"] .screen-overlay::before { opacity: 1; }

    .event-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 650px;
      margin-top: 14px;
      color: var(--ion-text-tertiary);
      font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .signal-readout {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 9px;
      border: 1px solid var(--ion-border);
      border-radius: var(--ion-radius-pill);
      color: var(--ion-text-secondary);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      background: rgba(var(--ion-rgb), 0.04);
    }
    .signal-readout i {
      width: 5px;
      height: 5px;
      flex: 0 0 5px;
      border: 1px solid var(--ion-border-active);
      border-radius: 50%;
      background: var(--ion-green);
      box-shadow: none;
    }
    .meta-divider {
      width: 1px;
      height: 10px;
      background: rgba(var(--ion-rgb), .18);
    }
    .event-source { color: var(--ion-text-tertiary); }
    .event-time {
      margin-left: auto;
      color: var(--ion-text-tertiary);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.18em;
    }
    .hud-toast[data-severity="critical"] .signal-readout { color: var(--ion-text); }
    .hud-toast[data-severity="critical"] .signal-readout i { background: var(--ion-bright); }

    .alert-progress {
      position: absolute;
      z-index: 5;
      right: 50px;
      bottom: 0;
      left: 339px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      background: var(--ion-border);
      pointer-events: none;
    }
    .alert-progress::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(var(--ion-rgb), .72) 8%, rgba(var(--ion-rgb), .44) 78%, transparent);
      transform: scaleX(1);
      transform-origin: left center;
      box-shadow: none;
    }
    .hud-toast.is-visible .alert-progress { opacity: var(--progress-opacity); }
    .hud-toast.is-visible .alert-progress::after { animation: alert-dwell 5s linear both; }
    .hud-toast.is-entering .event-meta { animation: meta-readout-in 280ms 810ms var(--ion-spring) both; }
    .hud-toast.is-exiting .event-meta { animation: meta-readout-out 150ms 20ms var(--ion-spring) both; }
    /* Idle motion is restricted to one 6s opacity breath on the panel inner
       highlight. The brief explicitly bans continuous 360deg rotation. */
    .hud-toast.is-visible .panel-shell::before { animation: panel-ambient-breathe 6s ease-in-out infinite; }

    @keyframes meta-readout-in {
      from { opacity: 0; transform: translate3d(0, 7px, 0); clip-path: inset(100% 0 0); }
      to { opacity: 1; transform: none; clip-path: inset(0); }
    }
    @keyframes meta-readout-out {
      from { opacity: 1; transform: none; }
      to { opacity: 0; transform: translate3d(0, -5px, 0); }
    }
    @keyframes alert-dwell { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    @keyframes panel-ambient-breathe { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
    @keyframes header-signal-packet {
      0%, 12% { opacity: 0; transform: translateX(0); }
      18% { opacity: .72; }
      48% { opacity: 0; transform: translateX(860%); }
      100% { opacity: 0; transform: translateX(860%); }
    }
    @keyframes signal-dot-pulse { 0%, 100% { opacity: .72; transform: scale(.86); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes critical-status-pulse {
      0%, 100% { border-color: rgba(var(--ion-rgb), .42); box-shadow: inset 0 0 14px rgba(var(--ion-rgb), .025), 0 0 9px rgba(var(--ion-rgb), .055); }
      50% { border-color: rgba(var(--ion-rgb), .58); box-shadow: inset 0 0 18px rgba(var(--ion-rgb), .04), 0 0 15px rgba(var(--ion-rgb), .11); }
    }

    @media (max-width: 1180px), (max-height: 660px) {
      .event-meta { gap: 7px; margin-top: 8px; font-size: 10px; letter-spacing: 0.06em; }
      .alert-progress { right: 36px; left: 174px; }
    }
    @media (max-width: 720px) {
      .event-meta { margin-top: 6px; }
      .event-source, .event-time, .meta-divider { display: none; }
      .alert-progress { right: 20px; left: 0; }
    }
    @media (max-width: 480px) {
      .event-meta { font-size: 10px; letter-spacing: .06em; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hud-toast .waveform[data-visualizer-state] {
        animation: none !important;
        transform: none !important;
        transition: opacity var(--ion-motion-micro) linear;
      }
      .hud-toast .waveform[data-visualizer-state="hidden"],
      .hud-toast .waveform[data-visualizer-state="exiting"] { opacity: 0 !important; }
      .hud-toast .waveform[data-visualizer-state="entering"],
      .hud-toast .waveform[data-visualizer-state="active"],
      .hud-toast .waveform[data-visualizer-state="speaking"] { opacity: 1 !important; }
      .hud-toast .waveform[data-visualizer-state]::before,
      .hud-toast .waveform[data-visualizer-state]::after { display: none; }
      .hud-toast .waveform[data-visualizer-state] .wave-bar {
        animation: none !important;
        opacity: .64 !important;
        transform: scaleY(.82) !important;
      }
      .hud-toast .waveform[data-visualizer-state] .wave-bar.is-dot {
        transform: scale(.9) !important;
      }
      .hud-toast.is-visible .badge-arc,
      .hud-toast.is-visible .panel-shell::before,
      .hud-toast.is-visible .alert-progress::after,
      .hud-toast.is-entering .event-meta,
      .hud-toast.is-exiting .event-meta {
        animation: none !important;
      }
      .alert-progress { opacity: .28; }
    }
  </style>
</head>
<body>
  <div class="demo-backdrop" aria-hidden="true">
    <div class="ambient-orbit"></div>
    <div class="ambient-copy">
      <strong>Ion Sense // HUD sandbox</strong>
      Local visual systems test<br>
      Awaiting notification event
    </div>
    <div class="ambient-index">
      <span>Interface</span><span>Ready</span>
      <span>Voice layer</span><span>Armed</span>
      <span>Queue</span><span>FIFO</span>
    </div>
  </div>

  <main class="hud-layer" aria-label="Ion Sense notification layer">
    <div class="screen-overlay" aria-hidden="true"><span class="screen-blur"></span></div>
    <section
      id="ion-toast"
      class="hud-toast"
      aria-live="polite"
      aria-atomic="true"
      aria-hidden="true"
      role="status"
    >
      <div class="panel-shell">
        <div class="panel-content">
          <header class="hud-header">
            <span class="brand-name">Ion Sense</span>
            <span class="header-rule" aria-hidden="true"></span>
            <button id="close-toast" class="close-button" type="button" aria-label="Dismiss notification"></button>
          </header>

          <div class="hud-body">
            <div id="event-icon" class="event-icon-shell" aria-hidden="true"></div>
            <div class="event-copy">
              <h1 id="event-title" class="event-title">Downloads finished</h1>
              <p id="event-message" class="event-message">All downloads completed successfully.</p>
              <div class="event-meta" aria-hidden="true">
                <span class="signal-readout"><i></i><span id="event-severity">Info signal</span></span>
                <span class="meta-divider"></span>
                <span id="event-source" class="event-source">Transfer monitor</span>
                <time id="event-time" class="event-time">00:00:00</time>
              </div>
            </div>
          </div>

          <footer class="hud-footer" aria-hidden="true">
            <svg class="speaker-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9v6h4l5 4V5L8 9H4Z"></path>
              <path d="M16 9.1a4.2 4.2 0 0 1 0 5.8"></path>
              <path d="M18.7 6.5a8 8 0 0 1 0 11"></path>
            </svg>
            <div id="waveform" class="waveform" data-visualizer-state="hidden" aria-hidden="true"></div>
            <p class="spoken-line">“WARNING.”</p>
          </footer>
        </div>
        <span class="alert-progress" aria-hidden="true"></span>
      </div>

      <div class="brand-badge" aria-hidden="true">
        <svg class="badge-svg" viewBox="0 0 240 240" role="img" aria-label="Ion Sense brand mark">
          <circle cx="120" cy="120" r="114" fill="none" class="badge-outer" pathLength="1"></circle>
          <path class="badge-arc" pathLength="1" d="M79 48 A84 84 0 0 1 204 115" fill="none" stroke-linecap="round"></path>
          <circle cx="120" cy="18" r="2" class="badge-dot-bright"></circle>
          <circle cx="215" cy="120" r="2" class="badge-dot-bright"></circle>
          <circle cx="26" cy="120" r="2" class="badge-dot-bright"></circle>
          <g class="badge-mark" fill="none" stroke-linecap="round">
            <path pathLength="1" d="M103 77H137"></path>
            <path pathLength="1" d="M120 92V148"></path>
            <path pathLength="1" d="M103 163H137"></path>
          </g>
        </svg>
      </div>
    </section>
  </main>

  <aside id="dev-harness" class="dev-harness" aria-label="Ion Sense event test harness" hidden>
    <div class="dev-harness-inner">
      <div class="dev-label"><span class="dev-live-dot"></span> Test events</div>
      <div class="dev-buttons">
        <button class="dev-button" type="button" data-event="battery_low">Battery low</button>
        <button class="dev-button" type="button" data-event="overheating">Overheating</button>
        <button class="dev-button" type="button" data-event="download_finished">Download done</button>
        <button class="dev-button" type="button" data-event="new_email">New email</button>
        <button class="dev-button" type="button" data-event="friend_message">Friend message</button>
        <button class="dev-button" type="button" data-event="package_delivered">Package · v2</button>
      </div>
      <output id="dev-status" class="dev-status" aria-live="polite">Idle · Q0</output>
    </div>
  </aside>

  <script>
    (() => {
      "use strict";

      const DISPLAY = Object.freeze({
        battery_low: {
          title: "BATTERY LOW",
          voiceLine: "Your battery is low. Please connect to a power source.",
          icon: `<svg viewBox="0 0 32 32"><rect x="4" y="9" width="22" height="14" rx="2.5"></rect><path d="M28 13v6"></path><path d="M8 16h5"></path><path d="M10.5 13.5v5"></path></svg>`
        },
        overheating: {
          title: "PC OVERHEATING",
          voiceLine: "Your computer is overheating. Please let it cool down.",
          icon: `<svg viewBox="2.75 1 32 32"><path d="M13 18.2V7a4 4 0 0 1 8 0v11.2a7 7 0 1 1-8 0Z"></path><path d="M17 9v12"></path><circle cx="17" cy="24" r="2.5"></circle><path d="M24.5 8.5h3M24.5 13h2"></path></svg>`
        },
        download_finished: {
          title: "DOWNLOADS FINISHED",
          voiceLine: "Your download has finished successfully.",
          icon: `<svg viewBox="0 0 32 32"><path d="m7 16 6 6L25 9"></path></svg>`
        },
        new_email: {
          title: "NEW EMAIL",
          voiceLine: "You have received a new email.",
          icon: `<svg viewBox="0 0 32 32"><rect x="4" y="7" width="24" height="18" rx="3"></rect><path d="m6 10 10 8 10-8"></path><path d="m6 23 7.3-7M26 23l-7.3-7"></path></svg>`
        },
        friend_message: {
          title: "FRIEND MESSAGE",
          voiceLine: "You have received a new message from a friend.",
          icon: `<svg viewBox="0 0 32 32"><path d="M6 7.5h20v14H14l-6.5 4v-4H6v-14Z"></path><path d="M11 14h.1M16 14h.1M21 14h.1" stroke-width="2.6"></path></svg>`
        },
        package_delivered: {
          title: "PACKAGE DELIVERED",
          voiceLine: "Your package has been delivered.",
          icon: `<svg viewBox="0 0 32 32"><path d="m5 10 11-6 11 6v13L16 29 5 23V10Z"></path><path d="m5 10 11 6 11-6M16 16v13M11 7l11 6"></path></svg>`
        }
      });

      const SEVERITIES = new Set(["info", "warning", "critical"]);
      const AUTO_DISMISS_MS = 6200;
      const queue = [];

      const toast = document.getElementById("ion-toast");
      const hudLayer = document.querySelector(".hud-layer");
      const titleNode = document.getElementById("event-title");
      const messageNode = document.getElementById("event-message");
      const severityNode = document.getElementById("event-severity");
      const sourceNode = document.getElementById("event-source");
      const timeNode = document.getElementById("event-time");
      const iconNode = document.getElementById("event-icon");
      const closeButton = document.getElementById("close-toast");
      const waveform = document.getElementById("waveform");
      const devHarness = document.getElementById("dev-harness");
      const devStatus = document.getElementById("dev-status");

      let activeEvent = null;
      let lifecycle = "idle";
      let dismissTimer = 0;
      let phaseTimer = 0;
      let speechTimer = 0;
      let speechVisualTimer = 0;
      let activeUtterance = null;
      let speechGeneration = 0;
      let visualizerState = "hidden";
      let visualizerFrame = 0;
      let visualizerGeneration = 0;
      let visualizerStartedAt = 0;
      let visualizerBars = [];
      const reducedMotionQuery = typeof window.matchMedia === "function"
        ? window.matchMedia("(prefers-reduced-motion: reduce)")
        : null;

      const prefersReducedMotion = () => reducedMotionQuery?.matches === true;

      const enterDuration = () => prefersReducedMotion() ? 180 : 1200;
      const exitDuration = () => prefersReducedMotion() ? 160 : 800;

      function makeWaveform() {
        // A fixed seed keeps the voice signature organic but stable between loads.
        let seed = 0x10A5E;
        const random = () => {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return seed / 4294967296;
        };

        const fragment = document.createDocumentFragment();
        const majorPeaks = new Set([8, 21, 34, 47]);
        const minorPeaks = new Set([5, 14, 27, 40, 52]);
        for (let index = 0; index < 61; index += 1) {
          const bar = document.createElement("span");
          const peak = majorPeaks.has(index);
          const accent = minorPeaks.has(index);
          const dotted = !peak && !accent;
          const height = peak ? Math.round(34 + random() * 6) : accent ? Math.round(10 + random() * 8) : 2;
          bar.className = `wave-bar${dotted ? " is-dot" : peak ? " is-peak" : " is-accent"}`;
          bar.style.setProperty("--bar-index", index);
          bar.style.setProperty("--bar-height", `${height}px`);
          bar.style.setProperty("--wave-enter-delay", `${690 + Math.abs(index - 30) * 3 + (peak ? 90 : accent ? 42 : 0)}ms`);
          bar.style.setProperty("--wave-exit-delay", `${Math.max(0, 30 - Math.abs(index - 30)) * 3}ms`);
          bar.__ionLevel = dotted ? .84 : .78;
          fragment.appendChild(bar);
        }
        waveform.replaceChildren(fragment);
        visualizerBars = Array.from(waveform.children);
      }

      function cancelVisualizerLoop() {
        visualizerGeneration += 1;
        window.cancelAnimationFrame(visualizerFrame);
        visualizerFrame = 0;
      }

      function setStaticVisualizerLevels() {
        visualizerBars.forEach((bar) => {
          const level = bar.classList.contains("is-dot") ? .9 : .82;
          bar.__ionLevel = level;
          bar.style.setProperty("--wave-level", String(level));
          bar.style.setProperty("--wave-opacity", bar.classList.contains("is-dot") ? ".64" : ".68");
        });
      }

      function captureVisualizerExitPose() {
        const containerStyle = getComputedStyle(waveform);
        const baselineStyle = getComputedStyle(waveform, "::before");
        const barStyles = visualizerBars.map((bar) => {
          const style = getComputedStyle(bar);
          return { opacity: style.opacity, transform: style.transform };
        });

        waveform.style.setProperty("--wave-exit-opacity", containerStyle.opacity);
        waveform.style.setProperty("--wave-exit-transform", containerStyle.transform === "none" ? "none" : containerStyle.transform);
        waveform.style.setProperty("--wave-baseline-exit-opacity", baselineStyle.opacity);
        waveform.style.setProperty("--wave-baseline-exit-transform", baselineStyle.transform);
        visualizerBars.forEach((bar, index) => {
          bar.style.setProperty("--wave-exit-opacity", barStyles[index].opacity);
          bar.style.setProperty("--wave-exit-transform", barStyles[index].transform);
        });
      }

      function startVisualizerLoop() {
        cancelVisualizerLoop();
        if (
          prefersReducedMotion() ||
          document.hidden ||
          (visualizerState !== "active" && visualizerState !== "speaking")
        ) {
          setStaticVisualizerLevels();
          return;
        }

        const generation = visualizerGeneration;
        let previousTime = performance.now();
        if (!visualizerStartedAt) visualizerStartedAt = previousTime;

        const animate = (time) => {
          if (
            generation !== visualizerGeneration ||
            document.hidden ||
            (visualizerState !== "active" && visualizerState !== "speaking")
          ) {
            visualizerFrame = 0;
            return;
          }

          const elapsed = (time - visualizerStartedAt) / 1000;
          const delta = Math.min(48, Math.max(0, time - previousTime));
          previousTime = time;
          const speaking = visualizerState === "speaking";
          const smoothing = 1 - Math.exp(-delta * (speaking ? .021 : .009));

          visualizerBars.forEach((bar, index) => {
            const dot = bar.classList.contains("is-dot");
            const peak = bar.classList.contains("is-peak");
            const accent = bar.classList.contains("is-accent");
            const phase = index * .47;
            const primary = Math.sin(elapsed * (speaking ? 8.2 : 1.32) + phase);
            const neighboring = Math.sin(elapsed * (speaking ? 5.1 : .73) + phase * .42 + .8);
            const envelope = (primary * .64 + neighboring * .36 + 1) * .5;
            let target;

            if (speaking) {
              target = dot
                ? .55 + envelope * .48
                : peak
                  ? .34 + envelope * .9
                  : .46 + envelope * .64;
            } else {
              target = dot
                ? .76 + envelope * .16
                : peak
                  ? .69 + envelope * .18
                  : accent
                    ? .7 + envelope * .16
                    : .74 + envelope * .12;
            }

            const current = Number.isFinite(bar.__ionLevel) ? bar.__ionLevel : target;
            const level = current + (target - current) * smoothing;
            bar.__ionLevel = level;
            bar.style.setProperty("--wave-level", level.toFixed(3));
            bar.style.setProperty(
              "--wave-opacity",
              (speaking ? .56 + envelope * .4 : .58 + envelope * .16).toFixed(3)
            );
          });

          visualizerFrame = window.requestAnimationFrame(animate);
        };

        visualizerFrame = window.requestAnimationFrame(animate);
      }

      function setVisualizerState(nextState, { restart = false } = {}) {
        const validStates = new Set(["hidden", "entering", "active", "speaking", "exiting"]);
        if (!validStates.has(nextState)) throw new TypeError(`Unknown visualizer state: ${nextState}`);
        if (!restart && visualizerState === nextState) {
          if (nextState === "active" || nextState === "speaking") startVisualizerLoop();
          return;
        }

        if (nextState === "exiting" && visualizerState !== "hidden") {
          captureVisualizerExitPose();
        }
        cancelVisualizerLoop();
        visualizerState = nextState;
        waveform.dataset.visualizerState = nextState;
        waveform.classList.toggle("is-speaking", nextState === "speaking");

        if (nextState === "hidden" || nextState === "entering") {
          waveform.style.removeProperty("--wave-exit-opacity");
          waveform.style.removeProperty("--wave-exit-transform");
          waveform.style.removeProperty("--wave-baseline-exit-opacity");
          waveform.style.removeProperty("--wave-baseline-exit-transform");
          if (nextState === "entering") visualizerStartedAt = performance.now();
          visualizerBars.forEach((bar) => {
            bar.style.removeProperty("--wave-exit-opacity");
            bar.style.removeProperty("--wave-exit-transform");
            const level = bar.classList.contains("is-dot") ? .84 : .78;
            bar.__ionLevel = level;
            bar.style.setProperty("--wave-level", String(level));
            bar.style.setProperty("--wave-opacity", ".68");
          });
        }
        if (nextState === "hidden") visualizerStartedAt = 0;
        if (nextState === "active" || nextState === "speaking") startVisualizerLoop();
      }

      /* Sets a node's text content. No per-character split: the title and
         message each fade in as a single block via the .is-entering rules. */
      function setStaggeredText(node, text) {
        node.removeAttribute("aria-label");
        node.setAttribute("aria-hidden", "true");
        node.textContent = String(text);
      }

      function normalizeEvent(candidate) {
        if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)) {
          throw new TypeError("Ion Sense event must be an object.");
        }
        if (!Object.prototype.hasOwnProperty.call(DISPLAY, candidate.type)) {
          throw new TypeError(`Unknown Ion Sense event type: ${String(candidate.type)}`);
        }
        if (typeof candidate.message !== "string") {
          throw new TypeError("Ion Sense event.message must be a string.");
        }
        if (!SEVERITIES.has(candidate.severity)) {
          throw new TypeError(`Unknown Ion Sense severity: ${String(candidate.severity)}`);
        }
        if (typeof candidate.timestamp !== "number" || !Number.isFinite(candidate.timestamp)) {
          throw new TypeError("Ion Sense event.timestamp must be a finite number.");
        }

        return Object.freeze({
          type: candidate.type,
          message: candidate.message,
          severity: candidate.severity,
          timestamp: candidate.timestamp
        });
      }

      function updateDevStatus() {
        if (devHarness.hidden) return;
        const state = lifecycle === "idle" ? "Idle" : lifecycle === "dismissing" ? "Next" : "Live";
        devStatus.value = `${state} · Q${queue.length}`;
        devStatus.textContent = `${state} · Q${queue.length}`;
      }

      function stopVoiceVisualization(generation = speechGeneration) {
        if (generation !== speechGeneration) return;
        window.clearTimeout(speechVisualTimer);
        speechVisualTimer = 0;
        if (activeUtterance) {
          activeUtterance.onstart = null;
          activeUtterance.onend = null;
          activeUtterance.onerror = null;
        }
        activeUtterance = null;
        if (visualizerState === "speaking" && (lifecycle === "entering" || lifecycle === "visible")) {
          setVisualizerState("active");
        }
      }

      function startVoiceVisualization(generation = speechGeneration, fallbackDuration = 1650) {
        if (
          generation !== speechGeneration ||
          (lifecycle !== "entering" && lifecycle !== "visible")
        ) return;
        window.clearTimeout(speechVisualTimer);
        setVisualizerState("speaking");
        speechVisualTimer = window.setTimeout(
          () => stopVoiceVisualization(generation),
          fallbackDuration
        );
      }

      function speakEventLine() {
        const generation = ++speechGeneration;
        const voiceLine = DISPLAY[activeEvent?.type]?.voiceLine || "Ion Sense has detected a new alert.";
        const visualDuration = Math.min(6000, Math.max(1800, 700 + voiceLine.length * 52));
        if (!("speechSynthesis" in window) || typeof window.SpeechSynthesisUtterance !== "function") {
          startVoiceVisualization(generation, visualDuration);
          return;
        }
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(voiceLine);
          utterance.rate = 0.92;
          utterance.pitch = 0.84;
          utterance.volume = 0.78;
          utterance.onstart = () => startVoiceVisualization(generation, visualDuration);
          utterance.onend = () => stopVoiceVisualization(generation);
          utterance.onerror = () => stopVoiceVisualization(generation);
          activeUtterance = utterance;
          window.speechSynthesis.speak(utterance);
          // WebView2 voices occasionally omit onstart. Start a visual fallback
          // on the next frame; a real onstart simply restarts it in sync.
          window.requestAnimationFrame(() => {
            if (generation === speechGeneration && visualizerState !== "speaking") {
              startVoiceVisualization(generation, visualDuration);
            }
          });
        } catch (error) {
          startVoiceVisualization(generation, visualDuration);
          console.info("Ion Sense voice preview is unavailable in this browser.", error);
        }
      }

      function renderEvent(event) {
        const display = DISPLAY[event.type];
        const message = event.type === "download_finished"
          ? "All downloads completed successfully."
          : event.message;
        const sourceLabels = {
          battery_low: "Power monitor",
          overheating: "Thermal sensor",
          download_finished: "Transfer monitor",
          new_email: "Mail listener",
          friend_message: "Message gateway",
          package_delivered: "Delivery sensor"
        };
        const severityLabel = `${event.severity[0].toUpperCase()}${event.severity.slice(1)} signal`;
        const eventDate = new Date(event.timestamp);
        const timeLabel = Number.isNaN(eventDate.getTime())
          ? "--:--:--"
          : eventDate.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
        setStaggeredText(titleNode, display.title);
        setStaggeredText(messageNode, message);
        severityNode.textContent = severityLabel;
        sourceNode.textContent = sourceLabels[event.type];
        timeNode.textContent = timeLabel;
        if (!Number.isNaN(eventDate.getTime())) timeNode.dateTime = eventDate.toISOString();
        iconNode.innerHTML = display.icon;
        iconNode.querySelectorAll("path, line, polyline, polygon, circle, rect, ellipse").forEach((geometry) => {
          geometry.setAttribute("pathLength", "1");
        });
        iconNode.dataset.icon = event.type;
        toast.dataset.eventType = event.type;
        toast.dataset.severity = event.severity;
        toast.dataset.timestamp = String(event.timestamp);
        hudLayer.dataset.eventType = event.type;
        hudLayer.dataset.severity = event.severity;
        toast.setAttribute("aria-live", event.severity === "critical" ? "assertive" : "polite");
        toast.setAttribute("role", event.severity === "critical" ? "alert" : "status");
        toast.setAttribute("aria-label", `${display.title}. ${message} ${severityLabel}.`);
      }

      function clearLifecycleTimers() {
        window.clearTimeout(dismissTimer);
        window.clearTimeout(phaseTimer);
        window.clearTimeout(speechTimer);
        window.clearTimeout(speechVisualTimer);
        dismissTimer = 0;
        phaseTimer = 0;
        speechTimer = 0;
        speechVisualTimer = 0;
        speechGeneration += 1;
        if (activeUtterance) {
          activeUtterance.onstart = null;
          activeUtterance.onend = null;
          activeUtterance.onerror = null;
        }
        activeUtterance = null;
        waveform.classList.remove("is-speaking");
      }

      function prepareNext() {
        if (lifecycle !== "idle" || queue.length === 0) {
          updateDevStatus();
          return false;
        }

        activeEvent = queue.shift();
        lifecycle = "preparing";
        renderEvent(activeEvent);
        makeWaveform();
        setVisualizerState("hidden", { restart: true });

        toast.classList.remove("is-entering", "is-visible", "is-exiting");
        toast.classList.add("is-preparing");
        hudLayer.classList.remove("is-entering", "is-visible", "is-exiting", "has-followup");
        hudLayer.classList.add("is-preparing");
        // Force layout while the native window is still hidden. WebView2 can
        // now allocate every masked/glowing layer before the first visible frame.
        void toast.offsetWidth;
        updateDevStatus();
        return true;
      }

      function beginPrepared(timestamp = activeEvent?.timestamp) {
        if (
          lifecycle !== "preparing" ||
          !activeEvent ||
          activeEvent.timestamp !== timestamp
        ) return false;

        const continuing = hudLayer.classList.contains("is-bridging");
        lifecycle = "entering";
        toast.classList.remove("is-preparing");
        toast.classList.add("is-entering");
        hudLayer.classList.remove("is-bridging", "is-preparing");
        hudLayer.classList.toggle("is-continuing", continuing);
        hudLayer.classList.add("is-entering");
        toast.setAttribute("aria-hidden", "false");
        setVisualizerState("entering");
        updateDevStatus();

        phaseTimer = window.setTimeout(() => {
          if (lifecycle !== "entering") return;
          toast.classList.remove("is-entering");
          toast.classList.add("is-visible");
          hudLayer.classList.remove("is-entering");
          hudLayer.classList.remove("is-continuing");
          hudLayer.classList.add("is-visible");
          lifecycle = "visible";
          if (visualizerState === "entering") setVisualizerState("active");
          updateDevStatus();
        }, enterDuration());

        speechTimer = window.setTimeout(speakEventLine, prefersReducedMotion() ? 0 : 1180);
        dismissTimer = window.setTimeout(() => void dismissCurrent("timeout"), AUTO_DISMISS_MS);
        return true;
      }

      function showNext() {
        if (!prepareNext()) return;
        beginPrepared();
      }

      async function dismissCurrent(reason = "manual") {
        if (lifecycle === "idle" || lifecycle === "dismissing") return false;

        clearLifecycleTimers();
        lifecycle = "dismissing";
        const timestamp = activeEvent?.timestamp;
        let hasFollowup = queue.length > 0;
        // Manual dismissal must feel immediate even if native IPC is slow.
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        toast.classList.remove("is-entering", "is-visible");
        toast.classList.add("is-exiting");
        hudLayer.classList.remove("is-entering", "is-visible", "is-continuing");
        hudLayer.classList.add("is-exiting");
        toast.dataset.dismissReason = reason;
        setVisualizerState("exiting");
        updateDevStatus();

        if (typeof window.__ionSenseContinuationProbe === "function" && Number.isSafeInteger(timestamp)) {
          try {
            const nativeFollowup = await Promise.race([
              window.__ionSenseContinuationProbe(timestamp),
              new Promise((resolve) => window.setTimeout(() => resolve(false), 140))
            ]);
            hasFollowup = Boolean(nativeFollowup) || queue.length > 0 || hasFollowup;
          } catch (error) {
            console.error("Ion Sense could not inspect its native event queue", error);
          }
        }
        if (lifecycle !== "dismissing" || activeEvent?.timestamp !== timestamp) return false;
        hudLayer.classList.toggle("has-followup", hasFollowup);

        phaseTimer = window.setTimeout(() => {
          toast.classList.remove("is-exiting");
          hudLayer.classList.remove("is-exiting", "has-followup");
          hudLayer.classList.toggle("is-bridging", hasFollowup);
          toast.setAttribute("aria-hidden", "true");
          setVisualizerState("hidden");
          activeEvent = null;
          lifecycle = "idle";
          updateDevStatus();
          window.setTimeout(showNext, 0);
        }, exitDuration());
        return true;
      }

      /**
       * Phase 2 integration contract. This is the only public entry point.
       * @param {{type: 'battery_low'|'overheating'|'download_finished'|'new_email'|'friend_message'|'package_delivered', message: string, severity: 'info'|'warning'|'critical', timestamp: number}} event
       * @returns {number} The event's 1-based position in the active + queued sequence.
       */
      window.ionSenseTrigger = function ionSenseTrigger(event) {
        const normalized = normalizeEvent(event);
        queue.push(normalized);
        const position = queue.length + (lifecycle === "idle" ? 0 : 1);
        updateDevStatus();
        showNext();
        return position;
      };

      // Native-only two-phase presentation: populate and paint while the
      // window is hidden, then reveal after Rust confirms the surface is shown.
      window.__ionSenseStage = function ionSenseStage(event) {
        const normalized = normalizeEvent(event);
        queue.push(normalized);
        const position = queue.length + (lifecycle === "idle" ? 0 : 1);
        updateDevStatus();
        const prepared = prepareNext();
        return { prepared, position, timestamp: normalized.timestamp };
      };
      window.__ionSenseReveal = (timestamp) => beginPrepared(timestamp);

      closeButton.addEventListener("click", () => void dismissCurrent("close"));

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && lifecycle !== "idle") {
          void dismissCurrent("escape");
        }
      });

      window.addEventListener("pagehide", (event) => {
        // Keep lifecycle timers intact for back/forward-cache restores; the
        // browser pauses them and resumes the active toast on pageshow.
        if (!event.persisted) {
          clearLifecycleTimers();
          setVisualizerState("hidden");
        }
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          cancelVisualizerLoop();
        } else if (visualizerState === "active" || visualizerState === "speaking") {
          startVisualizerLoop();
        }
      });
      reducedMotionQuery?.addEventListener?.("change", () => {
        if (visualizerState === "active" || visualizerState === "speaking") {
          startVisualizerLoop();
        }
      });

      const mockEvents = Object.freeze({
        battery_low: {
          message: "Battery at 12%. Connect a power source.",
          severity: "warning"
        },
        overheating: {
          message: "CPU package temperature reached 94°C.",
          severity: "critical"
        },
        download_finished: {
          message: "All downloads completed successfully.",
          severity: "info"
        },
        new_email: {
          message: "Maya Chen sent “Project Aurora — final notes”.",
          severity: "info"
        },
        friend_message: {
          message: "Nadia: “You around for a quick co-op run?”",
          severity: "info"
        },
        package_delivered: {
          message: "Your parcel was left at the front door.",
          severity: "info"
        }
      });

      const isDev = new URLSearchParams(window.location.search).get("dev") === "1";
      if (isDev) {
        devHarness.hidden = false;
        devHarness.addEventListener("click", (event) => {
          const button = event.target.closest("[data-event]");
          if (!button) return;
          const type = button.dataset.event;
          const mock = mockEvents[type];
          window.ionSenseTrigger({
            type,
            message: mock.message,
            severity: mock.severity,
            timestamp: Date.now()
          });
        });
      }

      makeWaveform();
      setVisualizerState("hidden", { restart: true });
      updateDevStatus();
    })();
  </script>
  <script>
    (() => {
      "use strict";

      const tauri = window.__TAURI__;
      if (!tauri) return;

      const EVENT_NAME = "ion-sense://trigger";
      const invoke = tauri.core.invoke;
      const appWindow = tauri.window.getCurrentWindow();
      const toast = document.getElementById("ion-toast");
      const closeButton = document.getElementById("close-toast");
      let cursorTimer = 0;
      let appliedIgnore = null;
      let ignoreChain = Promise.resolve();
      let cursorGeneration = 0;
      let cursorPollInFlight = false;
      let unlisten = null;
      let nativeDeliveryChain = Promise.resolve();

      const wait = (milliseconds) =>
        new Promise((resolve) => window.setTimeout(resolve, milliseconds));

      const nextCompositedFrame = () =>
        Promise.race([
          new Promise((resolve) =>
            window.requestAnimationFrame(() => window.requestAnimationFrame(resolve))
          ),
          wait(80)
        ]);

      async function invokeAfterNativeSetup(command, args) {
        let lastError;
        for (let attempt = 0; attempt < 80; attempt += 1) {
          try {
            return await invoke(command, args);
          } catch (error) {
            lastError = error;
            if (!String(error).includes("state not managed")) throw error;
            await wait(50);
          }
        }
        throw lastError;
      }

      function setClickThrough(ignore) {
        ignoreChain = ignoreChain
          .then(async () => {
            if (appliedIgnore === ignore) return;
            try {
              await appWindow.setIgnoreCursorEvents(ignore);
              appliedIgnore = ignore;
            } catch (error) {
              appliedIgnore = null;
              throw error;
            }
          })
          .catch((error) => console.error("Ion Sense cursor routing failed", error));
        return ignoreChain;
      }

      async function updateCloseHitTarget(generation) {
        if (generation !== cursorGeneration || cursorPollInFlight) return;
        cursorPollInFlight = true;
        if (
          toast.getAttribute("aria-hidden") !== "false" ||
          toast.classList.contains("is-exiting")
        ) {
          await setClickThrough(true);
          cursorPollInFlight = false;
          return;
        }

        try {
          const [cursor, origin, scaleFactor] = await Promise.all([
            tauri.window.cursorPosition(),
            appWindow.innerPosition(),
            appWindow.scaleFactor()
          ]);
          if (
            generation !== cursorGeneration ||
            toast.getAttribute("aria-hidden") !== "false" ||
            toast.classList.contains("is-exiting")
          ) {
            return;
          }
          const localX = (cursor.x - origin.x) / scaleFactor;
          const localY = (cursor.y - origin.y) / scaleFactor;
          const rect = closeButton.getBoundingClientRect();
          const padding = 10;
          const overClose =
            localX >= rect.left - padding &&
            localX <= rect.right + padding &&
            localY >= rect.top - padding &&
            localY <= rect.bottom + padding;
          if (
            generation !== cursorGeneration ||
            toast.getAttribute("aria-hidden") !== "false" ||
            toast.classList.contains("is-exiting")
          ) {
            await setClickThrough(true);
          } else {
            await setClickThrough(!overClose);
          }
        } catch (error) {
          console.error("Ion Sense close-button hit test failed", error);
          if (generation === cursorGeneration) await setClickThrough(true);
        } finally {
          cursorPollInFlight = false;
        }
      }

      function startCursorGate() {
        window.clearInterval(cursorTimer);
        const generation = ++cursorGeneration;
        updateCloseHitTarget(generation);
        cursorTimer = window.setInterval(() => updateCloseHitTarget(generation), 40);
      }

      async function stopCursorGateAndHide() {
        ++cursorGeneration;
        const timestamp = Number(toast.dataset.timestamp);
        window.clearInterval(cursorTimer);
        cursorTimer = 0;
        await setClickThrough(true);
        if (!Number.isSafeInteger(timestamp)) return;
        // Always acknowledge the completed native event. Rust validates the
        // timestamp; a newer local visual generation must not strand the FIFO.
        await invoke("hud_idle", { timestamp });
      }

      const visibilityObserver = new MutationObserver(() => {
        if (toast.getAttribute("aria-hidden") === "false") {
          startCursorGate();
        } else {
          stopCursorGateAndHide().catch((error) =>
            console.error("Ion Sense could not hide the idle HUD", error)
          );
        }
      });
      visibilityObserver.observe(toast, {
        attributes: true,
        attributeFilter: ["aria-hidden"]
      });

      async function connectNativeBridge() {
        unlisten = await tauri.event.listen(EVENT_NAME, ({ payload }) => {
          nativeDeliveryChain = nativeDeliveryChain.then(async () => {
            const staged = window.__ionSenseStage(payload);
            if (!staged?.prepared) {
              throw new Error("The HUD received an event while another event was still active");
            }
            // Hidden WebViews can throttle rAF. The timeout fallback still
            // guarantees a layout/style pass before the native surface shows.
            void toast.getBoundingClientRect();
            await nextCompositedFrame();
            const presented = await invoke("hud_present", { timestamp: payload.timestamp });
            if (!presented) return;
            await Promise.race([
              new Promise((resolve) => window.requestAnimationFrame(resolve)),
              wait(34)
            ]);
            window.__ionSenseReveal(payload.timestamp);
          }).catch((error) => console.error("Ion Sense event presentation failed", error));
        });
        window.__ionSenseContinuationProbe = (timestamp) =>
          invoke("hud_has_followup", { timestamp });
        if (document.fonts?.ready) await document.fonts.ready;
        const isDev = await invokeAfterNativeSetup("hud_ready");
        if (isDev) {
          window.ionSenseTest = (eventType) =>
            invoke("fire_test_event", { eventType });
        }
        await setClickThrough(true);
      }

      window.addEventListener("pagehide", () => {
        cursorGeneration += 1;
        window.clearInterval(cursorTimer);
        visibilityObserver.disconnect();
        if (typeof unlisten === "function") unlisten();
      });

      connectNativeBridge().catch((error) =>
        console.error("Ion Sense native bridge failed", error)
      );
    })();
  </script>
</body>
