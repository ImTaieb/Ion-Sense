[package]
name = "ion-sense"
version = "1.0.0"
description = "A tray-resident system-awareness utility with a cinematic notification HUD"
authors = ["Ion Sense"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "ion_sense_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
anyhow = "1"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
battery = "0.7.8"
dirs = "6"
futures = "0.3"
keyring = "4.1"
notify = "8.2"
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["component"] }
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
