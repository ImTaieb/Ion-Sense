[package]
name = "ion-sense"
version = "0.1.0"
description = "A tray-resident desktop notification HUD"
authors = ["Ion Sense"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "ion_sense_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
anyhow = "1"
battery = "0.7.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39.6", default-features = false, features = ["component"] }
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time"] }
